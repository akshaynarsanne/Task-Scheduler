services:
  postgres:
    image: postgres:17
    container_name: redis-task-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: task_manager
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:8
    container_name: redis-task-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: